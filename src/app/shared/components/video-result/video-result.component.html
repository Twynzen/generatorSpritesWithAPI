<div class="video-result">
  <div class="result-header">
    <h3 class="result-title">Video Generated</h3>
    <span class="result-cost">Cost: ${{ cost().toFixed(2) }}</span>
  </div>

  <div class="video-container">
    <video
      [src]="video().url"
      controls
      autoplay
      loop
      class="result-video"
    >
      Your browser does not support HTML5 video.
    </video>
  </div>

  <div class="video-metadata">
    <div class="metadata-row">
      <span class="metadata-label">URL:</span>
      <a [href]="video().url" target="_blank" class="metadata-link">
        Open in new tab
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
          <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
          <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
        </svg>
      </a>
    </div>

    @if (video().content_type) {
      <div class="metadata-row">
        <span class="metadata-label">Format:</span>
        <span class="metadata-value">{{ video().content_type }}</span>
      </div>
    }
  </div>

  <div class="result-actions">
    <button
      type="button"
      class="btn btn-primary"
      (click)="downloadVideo()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
      </svg>
      Download MP4
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="newGeneration.emit()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
      </svg>
      New Generation
    </button>
  </div>
</div>

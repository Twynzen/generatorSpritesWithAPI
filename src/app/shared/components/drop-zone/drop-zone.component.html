<div
  class="drop-zone"
  [class.drag-over]="isDragOver()"
  [class.loading]="isLoading()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    type="file"
    #fileInput
    accept="image/jpeg,image/png,image/webp,image/gif"
    (change)="onFileInputChange($event)"
    class="hidden"
  />

  <div class="drop-zone-content" (click)="fileInput.click()">
    @if (isLoading()) {
      <div class="loading-spinner">
        <svg class="animate-spin h-10 w-10 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="mt-2 text-sm">Processing image...</span>
      </div>
    } @else {
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <p class="text-lg font-medium text-slate-200 mt-4">
        Drag an image here
      </p>
      <p class="text-sm text-slate-400 mt-2">
        or click to select
      </p>
      <p class="text-xs text-slate-500 mt-4">
        PNG, JPG, WebP, GIF - Max 10MB
      </p>
    }
  </div>
</div>
